<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UEP TikTok Shop Performance Dashboard</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#fafbfc; --line:#e6e8ee; --line2:#edf0f4;
    --text:#171a21; --muted:#6b7280; --faint:#9aa1ad;
    --accent:#3b5bdb; --accent2:#5c7cfa; --accent-soft:rgba(59,91,219,.09);
    --good:#12b76a; --good-soft:rgba(18,183,106,.10); --bad:#e5484d; --bad-soft:rgba(229,72,77,.09);
    --amber:#d97706; --amber-soft:rgba(217,119,6,.10);
    --purple:#7048e8; --teal:#0ea5b7; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
    --radius:14px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0f1115; --surface:#161a21; --surface2:#1b2029; --line:#242b38; --line2:#20262f;
    --text:#e7eaef; --muted:#8b93a3; --faint:#5d6572;
    --accent:#6c8cff; --accent2:#8fa8ff; --accent-soft:rgba(108,140,255,.12);
    --good:#34d399; --good-soft:rgba(52,211,153,.12); --bad:#f87171; --bad-soft:rgba(248,113,113,.12);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,.12);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  .app{display:flex;min-height:100vh}
  /* ---------- sidebar ---------- */
  .side{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;border-bottom:1px solid var(--line)}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
  .brand .b1{font-size:13.5px;font-weight:800;letter-spacing:-.2px}
  .brand .b2{font-size:11px;color:var(--muted);margin-top:-2px}
  .nav{margin-top:16px;display:flex;flex-direction:column;gap:2px;flex:1}
  .nav .grp{font-size:10.5px;font-weight:700;letter-spacing:.9px;color:var(--faint);text-transform:uppercase;padding:14px 10px 6px}
  .nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);text-align:left;width:100%;transition:background .15s,color .15s}
  .nav button:hover{background:var(--surface2);color:var(--text)}
  .nav button.active{background:var(--accent-soft);color:var(--accent)}
  .nav .ico{width:17px;text-align:center;font-size:14px;flex:none}
  .side .foot{margin-top:14px;border-top:1px solid var(--line);padding:12px 10px 2px;font-size:11px;color:var(--faint)}
  .side .foot b{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;padding:22px 28px 40px}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .top .tt{flex:1;min-width:260px}
  .top h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
  .top .sub{font-size:12px;color:var(--muted);margin-top:1px}
  .seg{display:flex;gap:3px;padding:4px;border:1px solid var(--line);background:var(--surface);border-radius:11px}
  .seg button{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .seg button.active{background:var(--text);color:var(--bg)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
  .chip .dot{width:7px;height:7px;border-radius:99px;background:var(--good)}
  .chip .dot.warn{background:var(--amber)}
  .iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn:hover{color:var(--text);border-color:var(--faint)}

  .view{display:none}
  .view.active{display:block}
  .head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:2px 0 14px}
  .head h2{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
  .head .range{font-size:12px;color:var(--muted)}
  .muted{color:var(--muted)} .small{font-size:12px}

  /* status line + latest check */
  .statusline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
  .statusline b{color:var(--text)}
  .lsc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .lsc .d{font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--faint);text-transform:uppercase}
  .lsc .vals{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);flex:1}
  .lsc .vals b{color:var(--text);font-weight:700}
  .syncing{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:99px;padding:4px 10px}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 13px}
  .kpi .lbl{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:5px}
  .kpi .val{font-size:21px;font-weight:800;letter-spacing:-.5px;margin-top:5px;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi .sub b{color:var(--text)}
  .delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;margin-top:7px}
  .delta.up{color:var(--good);background:var(--good-soft)}
  .delta.down{color:var(--bad);background:var(--bad-soft)}
  .delta.flat{color:var(--muted);background:var(--surface2);border:1px solid var(--line)}

  .cols2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:16px}
  @media(max-width:1100px){.cols2{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .panel .pt{font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .panel .ps{font-size:11.5px;color:var(--muted);margin-bottom:12px}
  .bars{display:flex;align-items:flex-end;gap:26px;height:150px;padding-top:8px}
  .bars .bg{flex:1;display:flex;flex-direction:column;gap:6px}
  .bars .brow{display:flex;align-items:flex-end;gap:10px;height:100%}
  .bars .bt{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-align:center}
  .bar{flex:1;border-radius:7px 7px 3px 3px;position:relative;min-height:2px}
  .bar.gmv{background:linear-gradient(180deg,var(--accent2),var(--accent))}
  .bar.ord{background:linear-gradient(180deg,#34d399,#059669)}
  .bar .bl{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--faint)}
  .bar .bv{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;font-weight:800}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:26px}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .fstep{display:flex;align-items:center;gap:10px}
  .fstep .fn{width:118px;font-size:11.5px;color:var(--muted);text-align:right;flex:none}
  .fstep .fb{flex:1;height:24px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .fstep .ff{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .fstep:nth-child(2) .ff{opacity:.85}.fstep:nth-child(3) .ff{opacity:.7}.fstep:nth-child(4) .ff{opacity:.55}.fstep:nth-child(5) .ff{opacity:.4}
  .fstep .fv{width:52px;font-size:12.5px;font-weight:800;text-align:right;flex:none;font-variant-numeric:tabular-nums}

  /* stat mini cards */
  .mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:1100px){.mini4{grid-template-columns:repeat(2,1fr)}}
  .mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
  .mini .lbl{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
  .mini .val{font-size:19px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}

  /* tables */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);text-align:right;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
  th:first-child,td:first-child{text-align:left}
  td{padding:10px 14px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface2)}
  td .money{font-weight:700}
  .avatar{width:26px;height:26px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center;margin-right:9px;vertical-align:middle}
  .cname{font-weight:700;font-size:12.5px}
  .chandle{color:var(--faint);font-size:11px}
  .toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .search{flex:1;max-width:280px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:12.5px}
  .search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .btn{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}
  .btn:hover{color:var(--text);border-color:var(--faint)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent2)}

  /* creative cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px}
  .card .ct{font-size:13px;font-weight:800;line-height:1.35;margin-bottom:2px}
  .card .cm{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .card .cm b{color:var(--text)}
  .hook{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px;background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:8px 11px}
  .hook .sc{flex:none;width:44px;text-align:center;font-weight:800;font-size:12px;border-radius:7px;padding:3px 0}
  .sc.good{background:var(--good-soft);color:var(--good)} .sc.mid{background:var(--amber-soft);color:var(--amber)} .sc.low{background:var(--bad-soft);color:var(--bad)}
  .kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin:8px 0}
  .kv b{color:var(--text)}
  .sp{font-size:12px;color:var(--text);margin:5px 0;padding-left:11px;border-left:2px solid var(--line)}
  .sp b{color:var(--accent);font-weight:700}

  .notice{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:12px 16px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .notice .title{font-weight:800;color:var(--text)}
  .dt{width:100%;border-collapse:collapse;font-size:12px}
  .dt th{text-align:center}
  .dt td{padding:8px 5px;text-align:center}
  .dt td.pname{text-align:left;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dt td.ptot{font-weight:700;text-align:right}
  .dbar{background:var(--line);border-radius:4px;height:9px;margin:0 auto 3px;overflow:hidden;max-width:64px}
  .dfill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%}
  .dval{display:block;font-size:10.5px;font-weight:600}
  .dunit{display:block;font-size:9.5px;color:var(--faint)}
  .error{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:14px 18px;font-size:13px;margin-bottom:14px}
  .footline{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  /* attention panel */
  .attention{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px}
  .at-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .at-title{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text)}
  .at-time{font-size:11px;color:var(--faint)}
  .at-item{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
  .at-item:first-of-type{border-top:0}
  .at-metric{font-weight:800;font-size:12.5px;min-width:150px;color:var(--text)}
  .at-pct{font-weight:800;font-size:12px;border-radius:6px;padding:2px 8px;flex:none}
  .at-pct.good{color:var(--good);background:var(--good-soft)}
  .at-pct.bad{color:var(--bad);background:var(--bad-soft)}
  .at-effect{font-size:12px;color:var(--muted);flex:1;min-width:220px}
  .at-action{font-size:12px;color:var(--accent);font-weight:600;width:100%}
  .at-pct.mid{color:var(--amber);background:var(--amber-soft)}

  /* sparklines */
  .sparkwrap{margin-top:9px}
  .spark{width:100%;height:30px;display:block}

  /* run-rate */
  .runrate{display:inline-block;margin-left:10px;font-size:11.5px;color:var(--muted);background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 10px;font-weight:700}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(10,12,16,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:50;overflow-y:auto}
  .modal[hidden]{display:none}
  .modalbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px 24px;max-width:860px;width:100%}
  .md-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .md-title{font-size:15px;font-weight:800}
  .md-x{margin-left:auto}
  .avatar.lg{width:38px;height:38px;font-size:15px}

  /* print */
  @media print{
    .side,.top .chip,.iconbtn,.seg{display:none!important}
    .side{display:none!important}
    .main{padding:0}
    .app{display:block}
    body{background:#fff}
    .panel,.kpi,.lsc,.attention,.tablewrap{box-shadow:none;break-inside:avoid}
    .view{display:block!important;margin-bottom:22px}
    .modal{display:none!important}
  }
  /* mobile */
  @media(max-width:900px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;gap:10px;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}
    .brand{border-bottom:0;padding:0}
    .nav{flex-direction:row;overflow-x:auto;margin:0;gap:4px}
    .nav .grp{display:none}
    .nav button{white-space:nowrap;padding:6px 10px}
    .side .foot{display:none}
    .main{padding:16px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .mini4{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">U</div>
      <div><div class="b1">Commerce Desk</div><div class="b2">TikTok Shop control room</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="grp">Workspace</div>
      <button data-tab="overview" class="active"><span class="ico">▦</span>Overview</button>
      <button data-tab="financials"><span class="ico">$</span>Financials</button>
      <button data-tab="outreach"><span class="ico">⇄</span>Outreach</button>
      <div class="grp">Content</div>
      <button data-tab="creators"><span class="ico">◎</span>Creators</button>
      <button data-tab="videos"><span class="ico">▶</span>Videos</button>
      <button data-tab="creative"><span class="ico">✦</span>Creative</button>
      <div class="grp">Catalog</div>
      <button data-tab="products"><span class="ico">□</span>Products</button>
      <div class="grp">Growth</div>
      <button data-tab="ads"><span class="ico">▲</span>GMV Max</button>
      <button data-tab="sampling"><span class="ico">◇</span>Sampling</button>
      <button data-tab="live"><span class="ico">●</span>LIVE</button>
    </nav>
    <div class="foot"><b id="footShop">Upper Echelon Products</b><span id="footSrc">Source: Cruva REST</span><br><span id="footVer">schema 1.0</span></div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="tt">
        <h1 id="pageTitle">Shop operations overview</h1>
        <div class="sub" id="pageSub">Upper Echelon Products · Daily control room</div>
      </div>
      <span class="chip"><span class="dot" id="freshDot"></span><span id="freshChip">data status</span></span>
      <button class="iconbtn" id="themeBtn" title="Toggle theme">◐</button>
      <div class="seg" id="periodSeg"></div>
    </header>

    <div id="errorBox" class="error" hidden></div>

    <section id="view-overview" class="view active"></section>
    <section id="view-financials" class="view"></section>
    <section id="view-outreach" class="view"></section>
    <section id="view-creators" class="view"></section>
    <section id="view-videos" class="view"></section>
    <section id="view-creative" class="view"></section>
    <section id="view-products" class="view"></section>
    <section id="view-ads" class="view"></section>
    <section id="view-sampling" class="view"></section>
    <section id="view-live" class="view"></section>
  </main>
</div>
<div id="modal" class="modal" hidden><div class="modalbox" id="modalBox"></div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let REPORT=null, PRODUCTS=null, PROD_CURRENT=null, PROD_DAILY=null, BRIEF=null, FIN=null,
    GMVMAX=null, LIVES=null, SAMPLES=null, ATTENTION=null, TREND=null, TICKER=null,
    PERIOD="week", TAB="overview", PRODSEG="all";

const money = (v)=> (v==null?"n/a":"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
const num = (v)=> (v==null?"n/a":Number(v).toLocaleString("en-US"));
const esc = (s)=> String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (v)=> (v==null?"n/a":(v>0?"+":"")+Number(v).toFixed(1)+"%");
const parseDelta = (s)=>{ const m = /([+-]?\d+(?:\.\d+)?)%/.exec(s||""); return m? parseFloat(m[1]) : null; };
const rangeLabel = (k)=>{ const r=(REPORT&&REPORT.ranges||[]).find(x=>x.key===k); return r? r.label : k; };

const TITLES = {overview:"Shop operations overview",financials:"Financials",outreach:"Outreach funnel",
  creators:"Creator network",videos:"Video performance",creative:"Creative direction",products:"Product-level content",
  ads:"GMV Max campaigns",sampling:"Sample pipeline",live:"Live streams"};

function deltaChip(delta){
  if(delta==null) return '<span class="delta flat">n/a</span>';
  const cls = delta>0.5?"up":(delta<-0.5?"down":"flat");
  return '<span class="delta '+cls+'">'+pct(delta)+' vs prior period</span>';
}

function load(){
  Promise.all([
    fetch("data/latest.json",{cache:"no-store"}).then(async x=>{ if(!x.ok) throw new Error("report data unavailable ("+x.status+")"); return {json: await x.json(), lm: x.headers.get("last-modified")}; }),
    fetch("data/products.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/products_current.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/creative_brief.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/financials.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/products_daily.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/gmv_max.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/lives.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/samples.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/attention.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/trend_signals.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null),
    fetch("data/live_ticker.json",{cache:"no-store"}).then(x=>x.ok?x.json():null).catch(()=>null)
  ]).then(([r,p,pc,b,fin,pd,gm,li,sa,at,tr,tk])=>{
    if(!r.json.periods||!r.json.periods.week||!r.json.periods.month) throw new Error("unsupported or incomplete report data");
    REPORT=r.json; PRODUCTS=p; PROD_CURRENT=pc; BRIEF=b; FIN=fin; PROD_DAILY=pd;
    GMVMAX=gm; LIVES=li; SAMPLES=sa; ATTENTION=at; TREND=tr; TICKER=tk;
    buildPeriodSeg((REPORT.ranges&&REPORT.ranges.length)? REPORT.ranges : [
      {key:"week",label:"Last 7 days",days:7},{key:"14d",label:"Last 14 days",days:14},
      {key:"month",label:"Last 30 days",days:30},{key:"60d",label:"Last 60 days",days:60},
      {key:"90d",label:"Last 90 days",days:90}]);
    $("footShop").textContent = REPORT.shop? REPORT.shop.name : "Upper Echelon Products";
    $("footSrc").textContent = "Source: " + (REPORT.source||"Cruva");
    const fr = REPORT.freshness||{};
    let syncText = "data through " + (fr.data_through||"?");
    if(r.lm){
      const d = new Date(r.lm);
      if(!isNaN(d)) syncText = "synced "+d.toISOString().slice(5,16).replace("T"," ")+" UTC · data through "+(fr.data_through||"?");
    }
    $("freshChip").textContent = syncText;
    $("freshDot").className = "dot";
    applyDeepLink();
    renderAll();
  }).catch(err=>{
    $("errorBox").hidden = false;
    $("errorBox").textContent = "Could not load report data: " + err.message;
  });
}

function buildPeriodSeg(ranges){
  const seg = $("periodSeg");
  seg.innerHTML = "";
  ranges.forEach(r=>{
    if(!REPORT.periods[r.key]) return;
    const b = document.createElement("button");
    b.dataset.period = r.key;
    b.textContent = r.label;
    if(r.key===PERIOD) b.classList.add("active");
    b.onclick = ()=>{
      PERIOD = b.dataset.period;
      document.querySelectorAll("#periodSeg button").forEach(x=>x.classList.toggle("active",x===b));
      try{ history.replaceState(null,"","?tab="+TAB+"&period="+PERIOD); }catch(e){}
      renderAll();
    };
    seg.appendChild(b);
  });
}

function renderAll(){
  $("pageTitle").textContent = TITLES[TAB]||"Overview";
  $("pageSub").textContent = "Upper Echelon Products · " + (REPORT.freshness.data_through||"") + " · Daily control room";
  renderOverview(); renderFinancials(); renderOutreach(); renderCreators(); renderVideos();
  renderCreative(); renderProducts(); renderAds(); renderSampling(); renderLIVE();
}

/* ============================= OVERVIEW ============================= */
function spark(key){
  if(!TREND||!TREND.series||!TREND.series[key]) return "";
  const s = TREND.series[key];
  const max = Math.max(...s,1);
  const pts = s.map((v,i)=>[i*22, 26-(v/max)*22]).map(p=>p.join(",")).join(" ");
  return '<svg class="spark" viewBox="0 0 70 30" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function renderOverview(){
  const p = REPORT.periods[PERIOD]||REPORT.periods.week, m = REPORT.periods.month;
  const s = p.score, lsc = REPORT.latest_source_check||{};
  const t = p.outreach.totals, m0 = s.m||{};
  const syncNote = s.sync ? '<span class="syncing">◔ attribution syncing</span>' : "";

  let html = '<div class="statusline">Upper Echelon Products · <b>Complete data through '+REPORT.freshness.data_through+
    '</b> · Pulled '+REPORT.freshness.pulled_on+'</div>';

  // Live strip: in-progress week read from the per-minute ticker. Clearly
  // labeled as live/unvalidated so it is never confused with the validated
  // completed-week numbers above it.
  if(TICKER&&TICKER.values){
    const v=TICKER.values, tz=TICKER._provenance||{};
    let asOf="", age="";
    if(tz.pulled_at){
      const d=new Date(tz.pulled_at);
      if(!isNaN(d)){
        asOf=d.toISOString().slice(11,16)+" UTC";
        const mins=Math.max(0,Math.round((Date.now()-d.getTime())/60000));
        age=mins<=1?" just now":" "+mins+" min ago";
      }
    }
    const badge=TICKER.stale?'<span class="syncing">◔ live feed stalled</span>':'<span class="syncing">● LIVE</span>';
    const gmv=v.total_gmv!=null?money(v.total_gmv):"Syncing";
    const ord=v.platform_orders!=null?num(v.platform_orders):"Syncing";
    const aff=v.affiliate_gmv!=null?money(v.affiliate_gmv):"Syncing";
    const dm=v.dms_sent!=null?num(v.dms_sent):"Syncing";
    html += '<div class="statusline">'+badge+' <b>Week to date (in progress, live read)</b> · '+
      (TICKER.week_range||"")+' · GMV <b>'+gmv+'</b> · Orders <b>'+ord+'</b> · '+
      'Affiliate <b>'+aff+'</b> · DMs <b>'+dm+'</b> · as of '+asOf+' ('+age+')</div>';
  }

  // attention panel (fresh only; a stale shipped copy falls back to the
  // deterministic trend-derived items so the panel always matches the page)
  const attFresh = ATTENTION&&ATTENTION.updated_at&&REPORT.freshness&&REPORT.freshness.pulled_on
    ? String(ATTENTION.updated_at).slice(0,10) >= String(REPORT.freshness.pulled_on).slice(0,10) : false;
  const attItems = (attFresh&&ATTENTION.items&&ATTENTION.items.length)? ATTENTION.items
    : fallbackAttention();
  if(attItems.length){
    html += '<div class="attention">'+
      '<div class="at-head"><span class="at-title">What needs your attention</span>'+
      (ATTENTION&&ATTENTION.updated_at?'<span class="at-time">'+ATTENTION.updated_at.slice(0,16)+'</span>':"")+'</div>'+
      attItems.slice(0,5).map(a=>
        '<div class="at-item"><span class="at-metric">'+esc(a.metric)+'</span>'+
        '<span class="at-pct '+(a.direction==="down"?"bad":"good")+'">'+pct(a.pct)+'</span>'+
        '<span class="at-effect">'+esc(a.effect||"")+'</span>'+
        (a.action?'<span class="at-action">→ '+esc(a.action)+'</span>':"")+'</div>').join("")+
      '</div>';
  }

  // latest source check strip
  if(lsc.date){
    html += '<div class="lsc"><span class="d">Latest source check</span><div class="vals">'+
      '<span>Seller Center GMV <b>'+money(lsc.seller_center_gmv)+'</b></span>'+
      '<span>Orders <b>'+num(lsc.orders)+'</b></span>'+
      '<span>Units <b>'+num(lsc.units)+'</b></span>'+
      (lsc.gmv_max_revenue!=null?'<span>GMV Max revenue <b>'+money(lsc.gmv_max_revenue)+'</b></span>':"")+
      (lsc.gmv_max_spend!=null?'<span>Spend <b>'+money(lsc.gmv_max_spend)+'</b></span>':"")+
      (lsc.gmv_max_roas!=null?'<span>ROAS <b>'+Number(lsc.gmv_max_roas).toFixed(2)+'x</b></span>':"")+
      '</div>'+syncNote+'</div>';
  }

  // KPI row with deltas + sparklines. The chips use the selected period's own
  // per-metric deltas (honest for every range); weekly trend is the fallback.
  const aff = m0["Affiliate GMV"], comm = m0["Commission"];
  const dlt = s.deltas||{};
  const deltaPct = parseDelta(s.gmvDelta);
  html += '<div class="kpis">'+
    kpi("Seller Center GMV", money(s.gmv), deltaChip(deltaPct), (s.gmvDelta||"").replace(" vs prior period",""), spark("total_gmv"))+
    kpi("Orders", num(m0["Orders"]||0), deltaChip(dlt["Orders"]!=null? dlt["Orders"] : trendPct("platform_orders")), "", spark("platform_orders"))+
    kpi("GMV Max revenue", money(s.adRevenue), '<span class="delta '+(s.roas>=1.5?"up":(s.roas>=1?"flat":"down"))+'">ROAS '+Number(s.roas).toFixed(2)+'x</span>', "Spend "+money(s.adSpend), "")+
    kpi("Affiliate GMV", money(aff), deltaChip(dlt["Affiliate GMV"]!=null? dlt["Affiliate GMV"] : trendPct("affiliate_gmv")), "Commission "+money(comm), spark("affiliate_gmv"))+
    kpi("Creator output", num(m0["Videos posted"]||0), deltaChip(dlt["Videos posted"]!=null? dlt["Videos posted"] : trendPct("videos_posted")), num(m0["Creators posting"]||0)+" creators posting", spark("videos_posted"))+
    kpi("Video views", num(m0["Video views"]||0), deltaChip(dlt["Video views"]!=null? dlt["Video views"] : trendPct("video_views")), money(m0["LIVE GMV"]||0)+" LIVE GMV · "+num(m0["LIVE streams"]||0)+" streams", spark("video_views"))+
    '</div>';

  // two-column: trend + funnel
  html += '<div class="cols2">'+
    '<div class="panel"><div class="pt">GMV &amp; order trend</div><div class="ps">Period totals per selected range; every range ends at the same data date.'+
      runRate(p)+'</div>'+
      trendBars(p,m)+'</div>'+
    '<div class="panel"><div class="pt">Sample fulfillment pipeline</div><div class="ps">Creator seeding and delivery flow</div>'+
      funnel(t)+'</div>'+
    '</div>';

  // outreach queue
  html += '<div class="mini4">'+
    mini("DMs sent", t["DMs sent"])+mini("Collab invites", t["Collab invites"])+
    mini("Replies", t["Replies"])+mini("Creators with sales", t["Creators with sales"])+'</div>';

  // roster
  const rows = (REPORT.periods[PERIOD].creators||[]).slice(0,8).map(rosterRow).join("");
  html += '<div class="head" style="margin-top:6px"><h2>Creator sales roster</h2><span class="range">'+REPORT.periods[PERIOD].range+' · ranked by GMV · click a creator for details</span></div>'+
    '<div class="tablewrap"><table><thead><tr><th>Creator</th><th>GMV</th><th>Units</th><th>Views</th><th>Commission</th><th>Videos</th><th>LIVE sessions</th></tr></thead><tbody>'+rows+'</tbody></table></div>';

  $("view-overview").innerHTML = html;
}
function trendPct(key){
  if(!TREND||!TREND.changes) return null;
  const c = TREND.changes.find(x=>x.metric===key);
  return c? c.pct : null;
}
function adsDelta(){
  if(!GMVMAX||!GMVMAX.periods) return null;
  const p = GMVMAX.periods[PERIOD]||GMVMAX.periods.week, r0 = p.totals||{};
  const r = r0.revenue, s = r0.spend;
  return (s>0 && r>0)? ((r-s)/s*100) : null;
}
function runRate(p){
  const gmv = p.score.gmv||0;
  const days = p.score.days||30;
  const pace = gmv/days*30.4;
  return '<span class="runrate">'+days+'-day GMV '+money(gmv)+' · on pace for <b>'+money(pace)+'</b> per 30-day cycle</span>';
}
function fallbackAttention(){
  if(!TREND||!TREND.changes) return [];
  return TREND.changes.filter(c=>c.direction==="down").slice(0,4).map(c=>({
    metric: c.label, current: c.current, prior: c.prior, pct: c.pct, direction: "down",
    effect: "Declining week over week. Watch the funnel lag: this reaches GMV in 2 to 4 weeks.",
    action: "Review in the relevant tab; check whether the leading indicators upstream are also down."
  }));
}

function kpi(lbl, val, delta, sub, spk){
  return '<div class="kpi"><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div>'+
    (delta?'<div>'+delta+'</div>':"")+
    (sub?'<div class="sub">'+sub+'</div>':"")+
    (spk?'<div class="sparkwrap">'+spk+'</div>':"")+'</div>';
}
function mini(lbl, val){
  return '<div class="mini"><div><div class="lbl">'+lbl+'</div><div class="val">'+num(val==null?0:val)+'</div></div></div>';
}
function funnel(t){
  const steps = [["Sample requests","Sample requests"],["Samples approved","Samples approved"],
                 ["Samples shipped","Samples shipped"],["Samples delivered","Samples delivered"],
                 ["Creators with sales","Creators with sales"]];
  const first = t[steps[0][0]]||0;
  return '<div class="funnel">'+steps.map(st=>{
    const v = t[st[1]]||0, w = first? Math.max(4,Math.round(v/first*100)):0;
    return '<div class="fstep"><span class="fn">'+st[0]+'</span><div class="fb"><div class="ff" style="width:'+w+'%"></div></div><span class="fv">'+num(v)+'</span></div>';
  }).join("")+'</div>'+
  '<div class="muted small" style="margin-top:10px">Stage totals rendered exactly as supplied; they reflect independent operational states.</div>';
}
function trendBars(cur,mth){
  const wg=cur.score.gmv, mg=mth.score.gmv, wo=cur.score.m["Orders"]||0, mo=mth.score.m["Orders"]||0;
  const max = Math.max(wg,mg);
  const h=(v)=>Math.max(3,Math.round(v/max*120));
  return '<div class="bars">'+
    '<div class="bg"><div class="bt">'+esc(rangeLabel(PERIOD))+'</div><div class="brow">'+
      '<div class="bar gmv" style="height:'+h(wg)+'px"><span class="bv">'+money(wg)+'</span><span class="bl">GMV</span></div>'+
      '<div class="bar ord" style="height:'+h(wo)+'px"><span class="bv">'+num(wo)+'</span><span class="bl">Orders</span></div>'+
    '</div></div>'+
    '<div class="bg"><div class="bt">Last 30 days</div><div class="brow">'+
      '<div class="bar gmv" style="height:'+h(mg)+'px"><span class="bv">'+money(mg)+'</span><span class="bl">GMV</span></div>'+
      '<div class="bar ord" style="height:'+h(mo)+'px"><span class="bv">'+num(mo)+'</span><span class="bl">Orders</span></div>'+
    '</div></div>'+
    '</div><div class="legend"><span><i style="background:var(--accent)"></i>GMV</span><span><i style="background:#059669"></i>Orders</span></div>';
}
function rosterRow(r){
  const init = (r[0]||"?").trim().charAt(0).toUpperCase();
  const same = (r[0]||"") === (r[1]||"");
  return '<tr data-creator="'+esc(r[1])+'" style="cursor:pointer"><td><span class="avatar">'+esc(init)+'</span><span class="cname">'+esc(r[0])+'</span>'+(same?"":'<br><span class="chandle">'+esc(r[1])+'</span>')+'</td>'+
    '<td class="money">'+money(r[2])+'</td><td>'+num(r[3])+'</td><td>'+num(r[4])+'</td>'+
    '<td class="money">'+money(r[5])+'</td><td>'+num(r[6])+'</td><td>'+num(r[7])+'</td></tr>';
}

function renderFinancials(){
  if(!FIN||!FIN.periods[PERIOD]){ $("view-financials").innerHTML='<div class="notice"><span class="title">Financials unavailable</span><br>No financials data was found.</div>'; return; }
  const f = FIN.periods[PERIOD];
  const net = f.net_after_ads_commissions_refunds;
  const netCls = net<0?"down":"up";
  let html = '<div class="head"><h2>Financials</h2><span class="range">Operational P&amp;L, '+f.range+'</span></div>'+
    '<div class="notice"><span class="title">Scope</span><br>'+esc((FIN._provenance&&FIN._provenance.note)||"Operational P&L from Cruva data. The formal P&amp;L projection lives in the TikTok P&amp;L task (86ak1mbh4).")+'</div>'+
    '<div class="kpis" style="grid-template-columns:repeat(4,1fr)">'+
      kpi("Total GMV", money(f.revenue.total_gmv), "", "All channels")+
      kpi("Net of ads, commissions, refunds", money(net), '<span class="delta '+netCls+'">'+(net<0?"negative":"positive")+'</span>', "Excludes COGS")+
      kpi("Blended ROAS", Number(f.ratios.blended_roas).toFixed(2)+"x", "", "Total GMV / ad spend")+
      kpi("Commission rate", Number(f.ratios.commission_rate_pct).toFixed(1)+"%", "", "Of affiliate GMV")+
    '</div>'+
    '<div class="cols2">'+
      '<div class="panel"><div class="pt">Revenue stack</div><div class="ps">Where GMV comes from</div>'+revStack(f.revenue)+'</div>'+
      '<div class="panel"><div class="pt">Spend stack</div><div class="ps">What it costs</div>'+spendStack(f.spend)+'</div>'+
    '</div>'+
    '<div class="panel" style="margin-top:12px"><div class="pt">Efficiency ratios</div><div class="ps">Unit economics from the source snapshot</div>'+
      '<div class="mini4" style="margin:0">'+Object.entries(f.ratios).map(([k,v])=>mini(k.replace(/_/g," "), (typeof v==="number"? (v<50&&v>-50? Number(v).toFixed(2): Math.round(v)) : v))).join("")+'</div></div>';
  $("view-financials").innerHTML = html;
}
function revStack(r){
  const rows=[["Total GMV",r.total_gmv],["Affiliate GMV",r.affiliate_gmv],["Video GMV",r.video_gmv],["LIVE GMV",r.live_gmv],["Shop tab GMV",r.shop_tab_gmv],["GMV Max revenue",r.gmv_max_revenue],["Subscription revenue",r.subscription_revenue]];
  const max = Math.max(...rows.map(x=>x[1]||0));
  return '<div class="funnel">'+rows.map(x=>'<div class="fstep"><span class="fn">'+x[0]+'</span><div class="fb"><div class="ff" style="width:'+(max?Math.max(3,Math.round((x[1]||0)/max*100)):0)+'%"></div></div><span class="fv">'+money(x[1])+'</span></div>').join("")+'</div>';
}
function spendStack(r){
  const rows=[["Ad spend",r.ad_spend],["Commissions",r.commission],["Refunds",r.refund_amount],["Shipping",r.shipping_fees]];
  const max = Math.max(...rows.map(x=>x[1]||0));
  return '<div class="funnel">'+rows.map(x=>'<div class="fstep"><span class="fn">'+x[0]+'</span><div class="fb"><div class="ff" style="width:'+(max?Math.max(3,Math.round((x[1]||0)/max*100)):0)+'%"></div></div><span class="fv">'+money(x[1])+'</span></div>').join("")+'</div>';
}

/* ============================= OUTREACH ============================= */
function renderOutreach(){
  const o = REPORT.periods[PERIOD].outreach;
  const t = o.totals||{};
  const daily = o.daily||[];
  const steps=[["DMs sent","DMs sent"],["Collab invites","Collab invites"],["Replies","Replies"],
               ["Sample requests","Sample requests"],["Approved samples","Samples approved"],
               ["Delivered samples","Samples delivered"]];
  const first = t["DMs sent"]||1;
  let html = '<div class="head"><h2>Outreach funnel</h2><span class="range">'+REPORT.periods[PERIOD].range+'</span></div>'+
    '<div class="panel" style="margin-bottom:14px"><div class="pt">Funnel totals</div><div class="ps">The funnel the shop lives or dies on</div>'+
    '<div class="funnel">'+steps.map(st=>{
      const v=t[st[1]]||0;
      return '<div class="fstep"><span class="fn">'+st[0]+'</span><div class="fb"><div class="ff" style="width:'+Math.max(3,Math.round(v/first*100))+'%"></div></div><span class="fv">'+num(v)+'</span></div>';
    }).join("")+'</div></div>';
  if(daily.length){
    html += '<div class="panel"><div class="pt">Daily DMs sent</div><div class="ps">Per-day volume across the period</div>'+
      dailyArea(daily)+'</div>';
  }
  $("view-outreach").innerHTML = html;
}
function dailyArea(daily){
  const vals = daily.map(d=>d[1]||0);
  const max = Math.max(...vals,1), n = vals.length, W=720, H=140;
  const pts = vals.map((v,i)=>[20+i*(W-40)/(n-1||1), H-16-(v/max)*(H-40)]).join(" ");
  const labels = daily.map(d=>d[0].slice(5)).filter((_,i)=>i%Math.ceil(n/7)===0)
    .map((l,i)=>'<span style="left:'+(16+i*((W-40)/6))+'px">'+l+'</span>').join("");
  return '<svg viewBox="0 0 '+W+' '+(H+8)+'" style="width:100%;height:auto">'+
    '<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<polygon points="'+pts+' '+[20+(n-1)*(W-40)/(n-1||1),H-16].join(",")+' 20,'+(H-16)+'" fill="var(--accent-soft)" stroke="none"/>'+
    '</svg><div class="legend">'+labels+'</div>';
}

function renderVideos(){

function svgSeries(title, sub, days, series){
  if(!days||!days.length) return "";
  const W=760,H=180,padL=64,padB=26,padT=14;
  const max = Math.max(...series.flatMap(s=>s[1]))*1.15||1;
  const n = days.length;
  const X=(i)=>padL+i*(W-padL-16)/(n-1||1);
  const Y=(v)=>padT+(H-padT-padB)*(1-v/max);
  const path=(s)=>s.map((v,i)=>(i===0?"M":"L")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+
    series.map((s,i)=>'<path d="'+path(s[1])+'" fill="none" stroke="'+s[2]+'" stroke-width="2.5" stroke-linejoin="round" opacity="'+(i?0.9:1)+'"/>').join("")+
    '<g fill="var(--faint)" font-size="10">'+
      days.map((d,i)=>{ if(i%Math.ceil(n/8)!==0) return ""; return '<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+d.slice(5)+'</text>'; }).join("")+
    '</g><g fill="var(--faint)" font-size="10" text-anchor="end">'+
      [0,.5,1].map(f=>'<text x="'+(padL-6)+'" y="'+(Y(max*f)+3)+'">'+fmtAxis(max*f)+'</text>').join("")+
    '</g><line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-16)+'" y2="'+(H-padB)+'" stroke="var(--line)"/>'+
    '</svg><div class="legend">'+series.map(s=>'<span><i style="background:'+s[2]+'"></i>'+s[0]+'</span>').join("")+'</div>';
}
function fmtAxis(v){ return v>=1000? (v/1000).toFixed(1)+"k" : Math.round(v); }

  const daily = (PROD_DAILY&&PROD_DAILY.products)? PROD_DAILY.products.find(p=>p.product_id===prod.product_id):null;
  const bp = (BRIEF&&BRIEF.periods)? (BRIEF.periods[PERIOD]||BRIEF.periods.week) : null;
  const briefs = (bp&&bp.videos)? bp.videos.filter(v=>v.product_name===name||v.product_id===prod.product_id).slice(0,6):[];
  openModal(
    '<div class="md-head"><div class="md-title">'+esc(prod.product_name)+'</div><button class="btn md-x" onclick="closeModal()">✕</button></div>'+
    '<div class="kpis" style="grid-template-columns:repeat(4,1fr)">'+
      kpi("Price", money(prod.price))+kpi("Total GMV", money(prod.total_gmv))+
      kpi("Units", num(prod.units_sold))+
      kpi("Share of GMV", prod.total_gmv&&REPORT.periods[PERIOD].score.gmv? (prod.total_gmv/REPORT.periods[PERIOD].score.gmv*100).toFixed(1)+"%":"n/a")+'</div>'+
    (daily?'<div class="head" style="margin-top:14px"><h2>Daily GMV</h2><span class="range">last completed week</span></div>'+
      '<div class="tablewrap"><table class="dt"><thead><tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr></thead><tbody><tr>'+
      daily.daily.map(d=>'<td><span class="dval">'+(d.gmv>=1000?"$"+(d.gmv/1000).toFixed(1)+"k":"$"+Math.round(d.gmv))+'</span><span class="dunit">'+d.units+'u</span></td>').join("")+
      '</tr></tbody></table></div>':"")+
    (briefs.length?'<div class="head" style="margin-top:14px"><h2>Top videos</h2><span class="range">with hook analysis</span></div>'+
      '<div class="cards" style="grid-template-columns:1fr">'+briefs.map(v=>{
        const hk = v.hooks&&v.hooks[0];
        return '<div class="card"><div class="ct">'+esc(v.title||"")+'</div><div class="cm">'+esc(v.handle)+' · '+money(v.gmv)+' GMV · '+num(v.view_count)+' views</div>'+
          (hk?'<div class="hook"><span class="sc '+(hk.score>=8?"good":(hk.score>=6?"mid":"low"))+'">'+hk.score+'/10</span><span>'+esc(hk.hook||"")+'</span></div>':"")+'</div>';
      }).join("")+'</div>':"")
  );
}

/* ============================= EVENTS ============================= */
function setTab(tab){
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id==="view-"+tab));
  TAB = tab;
  $("pageTitle").textContent = TITLES[tab]||"Overview";
  try{ history.replaceState(null,"","?tab="+tab+"&period="+PERIOD); }catch(e){}
  window.scrollTo({top:0,behavior:"smooth"});
}
function applyDeepLink(){
  try{
    const p = new URLSearchParams(location.search);
    const per = p.get("period");
    if(per && REPORT && REPORT.periods && REPORT.periods[per]){
      PERIOD = per;
      document.querySelectorAll("#periodSeg button").forEach(x=>x.classList.toggle("active",x.dataset.period===per));
    }
    const t = p.get("tab");
    if(t && TITLES[t]) setTab(t);
  }catch(e){}
}
document.querySelectorAll("#nav button").forEach(b=>{
  b.onclick = ()=> setTab(b.dataset.tab);
});
document.addEventListener("click", (e)=>{
  const pb = e.target.closest("[data-prod]");
  if(pb){ PRODSEG = pb.dataset.prod; renderProducts(); return; }
  const cr = e.target.closest("[data-creator]");
  if(cr){ creatorModal(cr.dataset.creator); return; }
  const pr = e.target.closest("[data-product]");
  if(pr){ productModal(pr.dataset.product); }
});
$("themeBtn").onclick = ()=>{
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme==="dark"?"light":"dark";
};

load();
</script>
</body>
